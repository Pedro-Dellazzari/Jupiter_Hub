name: 'publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    # Environment do GitHub com os secrets do Supabase (VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY).
    environment: prod-release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=$(echo "$TAG" | grep -oE '[0-9]+(\.[0-9]+){2}.*')
          if [ -z "$VERSION" ]; then
            echo "Não consegui extrair uma versão semver da tag '$TAG'." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: sync app version with tag
        shell: bash
        run: node .github/scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: check Supabase build variables
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node .github/scripts/check-supabase-env.mjs

      # As variáveis VITE_* são embutidas no bundle na hora do build (pnpm build, chamado pelo tauri build).
      # Ficam só neste passo, e não no job inteiro, para os outros steps não as enxergarem.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Jupiter Hub v__VERSION__'
          releaseBody: 'Veja os assets abaixo para baixar e instalar esta versão.'
          releaseDraft: true
          prerelease: false
